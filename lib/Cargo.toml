[package]
name = "rbrotli-enc-lib"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hugepage-buffer = { path = "../hugepage-buffer" }
lsb-bitwriter = { path = "../lsb-bitwriter" }
zerocopy = { version = "0.7.32", features = ["derive"] }
bounded-utils = { path = "../bounded-utils" }
jxl_simd = { git = "https://github.com/veluca93/jxl-rs", branch = "simd-specialize", features = ["all-simd"] }

[dev-dependencies]
criterion = "0.5.1"
brotli-decompressor = "6.1.1"

[[bench]]
name = "bench"
harness = false

[lints]
workspace = true
